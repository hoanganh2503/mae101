<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAD101 · Thi thử trắc nghiệm</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="top"></div>
<div class="container">
  <h1>Ngân hàng đề thi MAD101</h1>
  <p class="muted">Chọn một đề để làm. Không cần đăng nhập. Kết quả &amp; thời gian làm bài được lưu lại trên máy của bạn.</p>

  <div class="flex" style="margin:14px 0">
    <input type="text" id="search" placeholder="Tìm đề…" style="min-width:240px">
    <select id="filter">
      <option value="haskey" selected>Có đáp án</option>
      <option value="all">Tất cả</option>
      <option value="todo">Chưa làm</option>
      <option value="done">Đã làm</option>
      <option value="nokey">Chưa có đáp án</option>
    </select>
    <span class="grow"></span>
    <span id="stat" class="muted small"></span>
  </div>

  <div id="list"></div>
</div>

<!-- Lớp phủ chọn cách làm cho đề nhiều câu (>100) -->
<div id="modeOverlay" class="overlay" style="display:none">
  <div class="card" style="max-width:440px;width:100%">
    <h2 style="margin-top:0" id="modeTitle">Chọn cách làm</h2>
    <p class="muted small" id="modeDesc"></p>
    <button class="btn" id="modeFull" style="width:100%;justify-content:center;margin-bottom:10px">Làm full</button>
    <button class="btn ghost" id="modeRandom" style="width:100%;justify-content:center">🎲 Random ~20 câu (2 câu mỗi 10 câu)</button>
    <button class="btn ghost" id="modeCancel" style="width:100%;justify-content:center;margin-top:14px">Huỷ</button>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
document.getElementById('top').outerHTML = renderTopbar('index.html');

let MANIFEST, ANSWERS, PROGRESS;

function hasKey(examId) {
  const k = ANSWERS[examId];
  return k && Object.keys(k).length > 0;
}

function examCard(exam) {
  const p = PROGRESS[exam.id] || {};
  const done = !!p.done;
  const keyed = hasKey(exam.id);
  const inprog = !done ? getInProgress(exam.id) : null;
  const badge = done
    ? `<span class="badge done">✓ Đã làm</span>`
    : (inprog
        ? `<span class="badge" style="background:rgba(217,119,6,.15);color:var(--amber)">⏳ Đang làm dở</span>`
        : `<span class="badge todo">Chưa làm</span>`);
  const nokey = keyed ? '' : `<span class="badge nokey" title="Admin chưa nhập đáp án">⚠ Chưa có đáp án</span>`;
  const inprogTotal = inprog ? (inprog.total || exam.count) : exam.count;
  const last = done
    ? `<div class="small muted">Lần gần nhất: <b>${p.lastScore}%</b> · ${fmtTime(p.lastTimeSec)} · ${fmtDate(p.lastAt)}${p.attempts>1?` · ${p.attempts} lần`:''}</div>`
    : (inprog
        ? `<div class="small muted">${inprog.mode==='r20'?'🎲 Random · ':''}Đã chọn ${Object.keys(inprog.picks||{}).length}/${inprogTotal} câu · còn ${fmtTime((inprogTotal*SEC_PER_QUESTION) - (inprog.elapsedSec||0))}</div>`
        : `<div class="small muted">&nbsp;</div>`);

  const startHref = `exam.html?exam=${encodeURIComponent(exam.id)}`;
  const bigExam = exam.count > 100;
  let primaryBtn;
  if (inprog) {
    // Tiếp tục: giữ đúng chế độ đang làm dở
    const m = inprog.mode === 'r20' ? '&mode=r20' : '';
    primaryBtn = `<a class="btn" href="${startHref}${m}">Tiếp tục →</a>`;
  } else if (bigExam) {
    // Đề >100 câu: cho chọn làm full hay random ~20 câu
    primaryBtn = `<button class="btn js-choose" data-exam="${exam.id}" data-count="${exam.count}">${done ? 'Làm lại' : 'Vào làm'} →</button>`;
  } else {
    primaryBtn = `<a class="btn" href="${startHref}">${done ? 'Làm lại' : 'Vào làm'} →</a>`;
  }

  return `
  <div class="card exam-card" data-done="${done}" data-name="${exam.name.toLowerCase()}">
    <div class="row">
      <div class="name">${exam.name}</div>
      <div class="flex" style="gap:6px">
        ${exam.year ? `<span class="pill" style="background:var(--primary);color:#fff">${exam.year}</span>` : ''}
        <span class="pill">${exam.count} câu</span>
      </div>
    </div>
    <div class="flex">${badge}${nokey}</div>
    ${last}
    <div class="row">
      ${primaryBtn}
      ${done ? `<a class="btn ghost" href="exam.html?exam=${encodeURIComponent(exam.id)}&review=1">Xem lại</a>` : ''}
    </div>
  </div>`;
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filter = document.getElementById('filter').value;
  const wrap = document.getElementById('list');
  wrap.innerHTML = '';
  let shown = 0, total = 0, doneCount = 0;

  const SECTION_LABEL = { FE: 'FE — Đề thi cuối kỳ', PT: 'PT — Progress Test / Quiz', RE: 'RE — Đề thi lại' };

  for (const sec of ['FE', 'PT', 'RE']) {
    const exams = (MANIFEST.sections[sec] || []);
    const cards = [];
    for (const e of exams) {
      total++;
      const p = PROGRESS[e.id] || {};
      if (p.done) doneCount++;
      if (q && !e.name.toLowerCase().includes(q)) continue;
      if (filter === 'todo' && p.done) continue;
      if (filter === 'done' && !p.done) continue;
      if (filter === 'haskey' && !hasKey(e.id)) continue;
      if (filter === 'nokey' && hasKey(e.id)) continue;
      cards.push(examCard(e));
      shown++;
    }
    if (cards.length === 0) continue;
    wrap.insertAdjacentHTML('beforeend',
      `<div class="section-head"><span class="tag">${sec}</span><h2 style="margin:0">${SECTION_LABEL[sec]}</h2><span class="pill">${cards.length} đề</span></div>
       <div class="grid cols" style="margin-top:12px">${cards.join('')}</div>`);
  }
  if (shown === 0) wrap.innerHTML = '<p class="muted">Không có đề nào khớp.</p>';
  document.getElementById('stat').textContent = `Đã làm ${doneCount}/${total} đề`;
}

// Modal chọn "Làm full" hay "Random ~20 câu" cho đề >100 câu
function setupModeChooser() {
  const ov = document.getElementById('modeOverlay');
  const desc = document.getElementById('modeDesc');
  const btnFull = document.getElementById('modeFull');
  const btnRand = document.getElementById('modeRandom');
  const btnCancel = document.getElementById('modeCancel');
  let curId = null;
  const close = () => { ov.style.display = 'none'; curId = null; };

  document.getElementById('list').addEventListener('click', (ev) => {
    const b = ev.target.closest('.js-choose');
    if (!b) return;
    curId = b.dataset.exam;
    const count = Number(b.dataset.count);
    const rand = 2 * Math.ceil(count / 10);   // 2 câu mỗi 10 câu
    desc.textContent = `Đề này có ${count} câu. Chọn làm toàn bộ, hoặc random ${rand} câu (mỗi 10 câu lấy ngẫu nhiên 2 câu). Đáp án & kết quả vẫn được chấm và gửi đầy đủ.`;
    btnFull.textContent = `Làm full (${count} câu)`;
    btnRand.textContent = `🎲 Random ${rand} câu (2 câu mỗi 10 câu)`;
    ov.style.display = 'flex';
  });

  btnFull.addEventListener('click', () => {
    if (curId) location.href = `exam.html?exam=${encodeURIComponent(curId)}`;
  });
  btnRand.addEventListener('click', () => {
    if (curId) location.href = `exam.html?exam=${encodeURIComponent(curId)}&mode=r20`;
  });
  btnCancel.addEventListener('click', close);
  ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
}

(async function () {
  try {
    [MANIFEST, ANSWERS] = await Promise.all([loadManifest(), loadAnswers()]);
    PROGRESS = getProgress();
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('filter').addEventListener('change', render);
    setupModeChooser();
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="card">Lỗi: ${e.message}<br><span class="muted small">Hãy chạy <code>node build-manifest.js</code> rồi mở qua một web server (xem README).</span></div>`;
  }
})();
</script>
</body>
</html>
